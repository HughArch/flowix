[package]
name = "flowix-core"
version.workspace = true
description = "Flowix business core: notebook / memo storage, search, threads. Zero Tauri dependency."
authors = ["you"]
edition.workspace = true

[lib]
name = "flowix_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
dirs = { workspace = true }
walkdir = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
nanoid = { workspace = true }
dunce = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
fs2 = { workspace = true }
diffy = "0.5.2"

# TLS roots 按 target 分段 (与 flowix-desktop 同一策略): 桌面用系统根证书
# (企业代理 / 自签可用), Android 取不到系统 CA 存储, 用内置 webpki 根。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
