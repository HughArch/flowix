# dsh-flownote-memory: connect any DeepSeek Harness instance to the local
# flownote-cli MCP server. The launcher keeps the tool available when Flownote is
# not installed and returns an actionable installation message to the agent.
# The launcher honors FLOWNOTE_DSH_MCP_CLI and FLOWNOTE_CLI_PATH before PATH.
#
# Keep this row in sync with config/flownote.cordis.yml (id and serverName);
# tests/bundle-sync.test.ts guards the drift.
- insert:
    - id: dsh-flownote-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: flownote
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "process.env.DSH_PROFILE_DIR + '/node_modules/dsh-flownote-memory/launcher.mjs'"
